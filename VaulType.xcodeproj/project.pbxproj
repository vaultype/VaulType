		A0B1C2D3E4F5A6B7C8D9E0F4 /* Strip Sparkle for App Store */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
			);
			name = "Strip Sparkle for App Store";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "set -e\n# Remove Sparkle.framework from App Store builds\nif [[ \"$CONFIGURATION\" == *\"AppStore\"* ]]; then\n  # Remove from inside the .app bundle\n  SPARKLE_APP_PATH=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Frameworks/Sparkle.framework\"\n  if [ -d \"$SPARKLE_APP_PATH\" ]; then\n    rm -rf \"$SPARKLE_APP_PATH\"\n    echo \"Stripped Sparkle.framework from app bundle\"\n  fi\n  # Remove the loose framework from build products so dyld cannot find it via @rpath\n  SPARKLE_LOOSE_PATH=\"${BUILT_PRODUCTS_DIR}/Sparkle.framework\"\n  if [ -d \"$SPARKLE_LOOSE_PATH\" ]; then\n    rm -rf \"$SPARKLE_LOOSE_PATH\"\n    echo \"Stripped loose Sparkle.framework from build products\"\n  fi\n  # Also remove the PackageFrameworks copy\n  SPARKLE_PKG_PATH=\"${BUILT_PRODUCTS_DIR}/PackageFrameworks/Sparkle.framework\"\n  if [ -d \"$SPARKLE_PKG_PATH\" ]; then\n    rm -rf \"$SPARKLE_PKG_PATH\"\n    echo \"Stripped Sparkle.framework from PackageFrameworks\"\n  fi\n  # Verify removal — fail the build if Sparkle is still inside the app\n  if [ -d \"$SPARKLE_APP_PATH\" ]; then\n    echo \"error: Failed to strip Sparkle.framework from App Store build!\"\n    exit 1\n  fi\nfi\n";
			showEnvVarsInLog = 0;
		};
