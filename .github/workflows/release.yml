name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WHISPER_TAG: "v1.7.4"
  LLAMA_TAG: "b8059"
  XCODE_VERSION: "16.2"
  APP_NAME: "VaulType"
  SCHEME: "VaulType"
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  release:
    name: Build, Sign & Release
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout & Environment
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $TAG"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app

      - name: Install CMake
        run: |
          if ! command -v cmake &>/dev/null; then
            brew install cmake
          fi

      # ------------------------------------------------------------------
      # 2. Vendor Libraries (cached)
      # ------------------------------------------------------------------
      - name: Cache vendor libraries
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/whisper.cpp
            vendor/llama.cpp
            WhisperKit/Sources/CWhisper/include
          key: vendor-${{ env.WHISPER_TAG }}-${{ env.LLAMA_TAG }}-${{ runner.arch }}
          restore-keys: |
            vendor-${{ env.WHISPER_TAG }}-${{ env.LLAMA_TAG }}-

      - name: Build whisper.cpp
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: ./scripts/setup-whisper.sh

      - name: Build llama.cpp
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: ./scripts/setup-llama.sh

      - name: Restore whisper headers (cache hit)
        if: steps.vendor-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p WhisperKit/Sources/CWhisper/include
          if [ ! -f WhisperKit/Sources/CWhisper/include/whisper.h ]; then
            cp vendor/whisper.cpp/include/whisper.h WhisperKit/Sources/CWhisper/include/
          fi

      # ------------------------------------------------------------------
      # 3. Code Signing Setup
      # ------------------------------------------------------------------
      - name: Install Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Decode certificate (printf avoids echo mangling multiline base64)
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          # Create and configure temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERT_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access keychain
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to keychain search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 4. Build & Archive
      # ------------------------------------------------------------------
      - name: Build Release archive
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -archivePath build/${APP_NAME}.xcarchive \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            MARKETING_VERSION="${RELEASE_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            2>&1 | tail -30

      - name: Inject Team ID into ExportOptions
        run: sed -i '' "s/__TEAM_ID__/${TEAM_ID}/" ExportOptions.plist

      - name: Export signed app
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/${APP_NAME}.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            2>&1 | tail -20

      - name: Verify code signature
        run: |
          APP_PATH="build/export/${APP_NAME}.app"
          echo "=== Code signature verification ==="
          codesign --verify --deep --strict "$APP_PATH"
          echo ""
          echo "=== Signing identity ==="
          codesign -dvv "$APP_PATH" 2>&1 | grep "Authority"
          echo ""
          echo "=== Hardened runtime ==="
          codesign -dvv "$APP_PATH" 2>&1 | grep -i "runtime" || true

      # ------------------------------------------------------------------
      # 5. Notarize
      # ------------------------------------------------------------------
      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP_PATH="build/export/${APP_NAME}.app"

          # Create a zip for notarization (notarytool requires zip or dmg)
          ditto -c -k --keepParent "$APP_PATH" build/${APP_NAME}-notarize.zip

          echo "Submitting for notarization..."
          xcrun notarytool submit build/${APP_NAME}-notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --timeout 30m

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$APP_PATH"

          echo "Verifying notarization..."
          spctl --assess --type execute -v "$APP_PATH"

      # ------------------------------------------------------------------
      # 6. Create DMG
      # ------------------------------------------------------------------
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_PATH="build/export/${APP_NAME}.app"
          ./scripts/create-dmg.sh "$RELEASE_VERSION" "$APP_PATH"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG_PATH="build/${APP_NAME}-${RELEASE_VERSION}.dmg"

          echo "Submitting DMG for notarization..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --timeout 30m

          echo "Stapling DMG..."
          xcrun stapler staple "$DMG_PATH"

      # ------------------------------------------------------------------
      # 7. Compute Signatures
      # ------------------------------------------------------------------
      - name: Compute checksums and Sparkle signature
        id: signatures
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG_PATH="build/${APP_NAME}-${RELEASE_VERSION}.dmg"

          # SHA256
          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA256"

          # DMG file size
          DMG_SIZE=$(stat -f%z "$DMG_PATH")
          echo "dmg_size=$DMG_SIZE" >> "$GITHUB_OUTPUT"

          # Sparkle EdDSA signature using sign_update from resolved SPM package
          # Search in order: DerivedData SPM artifacts (most reliable), then broader DerivedData, then build/
          SPARKLE_BIN=$(find ~/Library/Developer/Xcode/DerivedData/VaulType-*/SourcePackages \
            -name 'sign_update' -type f 2>/dev/null | head -1 || true)
          if [ -z "$SPARKLE_BIN" ]; then
            SPARKLE_BIN=$(find ~/Library/Developer/Xcode/DerivedData \
              -name 'sign_update' -type f 2>/dev/null | head -1 || true)
          fi
          if [ -z "$SPARKLE_BIN" ]; then
            SPARKLE_BIN=$(find build -name 'sign_update' -type f 2>/dev/null | head -1 || true)
          fi

          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set — cannot sign release for Sparkle auto-update"
            exit 1
          fi

          if [ -z "$SPARKLE_BIN" ]; then
            echo "::error::Sparkle sign_update binary not found in DerivedData or build directory"
            exit 1
          fi

          chmod +x "$SPARKLE_BIN"
          ED_SIGNATURE=$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$SPARKLE_BIN" "$DMG_PATH" -f -)
          if [ -z "$ED_SIGNATURE" ]; then
            echo "::error::Sparkle sign_update produced empty signature"
            exit 1
          fi
          echo "ed_signature=$ED_SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "Sparkle EdDSA signature computed"

      # ------------------------------------------------------------------
      # 8. Create GitHub Release
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.signatures.outputs.sha256 }}
        run: |
          DMG_PATH="build/${APP_NAME}-${RELEASE_VERSION}.dmg"

          gh release create "v${RELEASE_VERSION}" \
            --title "VaulType v${RELEASE_VERSION}" \
            --generate-notes \
            "$DMG_PATH#VaulType-${RELEASE_VERSION}.dmg"

          echo ""
          echo "Release created: v${RELEASE_VERSION}"
          echo "SHA256: ${SHA256}"

      # ------------------------------------------------------------------
      # 9. Update Homebrew Cask
      # ------------------------------------------------------------------
      - name: Update Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.signatures.outputs.sha256 }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "Warning: HOMEBREW_TAP_TOKEN not set, skipping Homebrew cask update"
            exit 0
          fi

          CASK_CONTENT=$(cat <<'CASK'
          cask "vaultype" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA256_PLACEHOLDER"

            url "https://github.com/vaultype/VaulType/releases/download/v#{version}/VaulType-#{version}.dmg"
            name "VaulType"
            desc "Privacy-first speech-to-text for macOS — runs 100% locally"
            homepage "https://github.com/vaultype/VaulType"

            depends_on macos: ">= :sonoma"
            depends_on arch: :arm64

            app "VaulType.app"

            zap trash: [
              "~/Library/Application Support/VaulType",
              "~/Library/Preferences/com.vaultype.VaulType.plist",
              "~/Library/Caches/com.vaultype.VaulType",
            ]
          end
          CASK
          )

          CASK_CONTENT="${CASK_CONTENT//VERSION_PLACEHOLDER/$RELEASE_VERSION}"
          CASK_CONTENT="${CASK_CONTENT//SHA256_PLACEHOLDER/$SHA256}"

          # Get current file SHA for update
          FILE_SHA=$(curl -s \
            -H "Authorization: token $HOMEBREW_TAP_TOKEN" \
            "https://api.github.com/repos/vaultype/homebrew-vaultype/contents/Casks/vaultype.rb" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")

          # Update the cask file
          ENCODED=$(echo "$CASK_CONTENT" | base64)
          curl -s -X PUT \
            -H "Authorization: token $HOMEBREW_TAP_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/vaultype/homebrew-vaultype/contents/Casks/vaultype.rb" \
            -d "{
              \"message\": \"chore: bump vaultype to v${RELEASE_VERSION}\",
              \"content\": \"${ENCODED}\",
              \"sha\": \"${FILE_SHA}\"
            }"

          echo "Homebrew cask updated to v${RELEASE_VERSION}"

      # ------------------------------------------------------------------
      # 10. Update Appcast
      # ------------------------------------------------------------------
      - name: Update appcast.xml
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          ED_SIGNATURE: ${{ steps.signatures.outputs.ed_signature }}
        run: |
          DMG_PATH="build/${APP_NAME}-${RELEASE_VERSION}.dmg"
          ./scripts/update-appcast.sh "$RELEASE_VERSION" "$BUILD_NUMBER" "$DMG_PATH" "$ED_SIGNATURE"

      - name: Prepare appcast for deployment
        run: |
          mkdir -p build/gh-pages
          cp appcast.xml build/gh-pages/

      - name: Deploy appcast to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/gh-pages
          publish_branch: gh-pages
          keep_files: true

      # ------------------------------------------------------------------
      # 11. Cleanup
      # ------------------------------------------------------------------
      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "${keychain_path:-}" ]; then
            security delete-keychain "$keychain_path" 2>/dev/null || true
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            build/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: warn
          retention-days: 30
